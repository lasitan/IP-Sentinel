name: Auto tag from version.txt

on:
  push:
    branches:
      - main
    paths:
      - version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need full history/tags to detect existing tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag from MASTER_VERSION
        env:
          # softprops/release and tag push via GITHUB_TOKEN work on same repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f version.txt
          MASTER_VERSION="$(awk -F= '/^MASTER_VERSION=/{print $2; exit}' version.txt | tr -d '\r" '"'"'')"
          AGENT_VERSION="$(awk -F= '/^AGENT_VERSION=/{print $2; exit}' version.txt | tr -d '\r" '"'"'')"

          if [ -z "$MASTER_VERSION" ] || [ -z "$AGENT_VERSION" ]; then
            echo "version.txt incomplete" >&2
            exit 1
          fi
          if ! [[ "$MASTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "invalid MASTER_VERSION: ${MASTER_VERSION}" >&2
            exit 1
          fi

          TAG="v${MASTER_VERSION}"
          echo "MASTER_VERSION=${MASTER_VERSION} AGENT_VERSION=${AGENT_VERSION} -> tag ${TAG}"

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skip create (release workflow may already have run)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (MASTER=${MASTER_VERSION} AGENT=${AGENT_VERSION})"
          git push origin "refs/tags/${TAG}"
          echo "Pushed ${TAG}"

name: Automated Massive UA Factory

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Run UA Factory Generator
      run: python scripts/ua_generator.py
    - name: Commit and Push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/user_agents.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): refresh UA pool" && git push)

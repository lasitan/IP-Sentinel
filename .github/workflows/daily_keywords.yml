name: Daily Data Factory

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install script deps
        run: pip install -r scripts/requirements.txt
      - name: Execute Trends Engine
        run: python scripts/fetch_trends.py
      - name: Execute Trust URL Engine
        run: python scripts/fetch_trust_urls.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keywords/ data/regions/
          if git diff --staged --quiet; then
            echo "No changes, skipping."
            exit 0
          fi
          git commit -m "chore(data): sync keywords and regions [$(date +'%Y-%m-%d')]"
          git push origin main
